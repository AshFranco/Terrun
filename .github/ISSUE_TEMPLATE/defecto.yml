name: Defecto
description: Algo no funciona como dicen los criterios de aceptación
title: "DEF: "
labels: [defecto]
body:
  - type: input
    id: historia
    attributes:
      label: Historia relacionada
      placeholder: CTZ-33
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: ['Alta - bloquea un flujo P0 o pierde datos', 'Media - funciona con un rodeo', 'Baja - cosmético']
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado vs. obtenido
    validations: { required: true }
  - type: input
    id: ambiente
    attributes:
      label: Dispositivo / ambiente / versión de la app
      placeholder: "Samsung A54, Android 15, QA, 0.3.0"
    validations: { required: true }
